[project]
name = "kiral"
version = "0.2.0"
description = "Chirality-aware SE(3)-equivariant protein–ligand docking with VP-SDE diffusion"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "posebusters>=0.6.5",
    "rdkit>=2025.9.6",
    "torch>=2.10.0",
    "torch-geometric>=2.7.0",
    "torchaudio>=2.10.0",
    "torchvision>=0.25.0",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.scripts]
kiral = "kiral.cli:main"
equidock = "kiral.cli:main"
equidock-diff = "kiral.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
