[project]
name = "equidock-diff"
version = "0.2.0"
description = "Kiral: High-throughput SE(3)-equivariant molecular docking engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "rdkit>=2025.9.6",
    "torch>=2.10.0",
    "torch-geometric>=2.7.0",
    "torchaudio>=2.10.0",
    "torchvision>=0.25.0",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.scripts]
kiral = "equidock_diff.cli:main"
equidock = "equidock_diff.cli:main"
equidock-diff = "equidock_diff.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
